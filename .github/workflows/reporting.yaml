---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Scheduled security/quality report. Runs daily, refreshing GitHub Pages every
# day; the Slack digest is posted only on the configured report_day (the tool
# owns that decision via the should_notify output).
name: "Security Report 🔐"

# yamllint disable-line rule:truthy
on:
  schedule:
    # Daily at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Post report immediately to Slack"
        required: false
        type: boolean
        default: false
      use_local_source:
        description: "Run the tool from this checkout instead of PyPI (for testing unreleased code)"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: "security-report"
  cancel-in-progress: false

jobs:
  build:
    name: "Generate report"
    runs-on: ubuntu-latest
    # Run this job in a dedicated environment so its execution and any
    # environment-scoped secrets can be gated by environment protection
    # rules (satisfies zizmor's secrets-outside-env).
    environment: 'production'
    permissions:
      contents: read
      pages: write  # configure-pages reads and can enable the Pages site
    timeout-minutes: 20
    steps:
      - name: "Harden runner"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: "Checkout repository"
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Configure Pages"
        # yamllint disable-line rule:line-length
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: "Resolve Pages URL"
        id: pages-url
        shell: bash
        run: |
          # Derive the Pages URL for the running repository so the Slack link
          # is correct in forks as well as upstream.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY##*/}"
          echo "url=https://${owner}.github.io/${repo}/" >> "$GITHUB_OUTPUT"

      - name: "Generate report"
        id: report
        uses: ./
        with:
          scope: "org"
          # Plain JSON in a variable, or base64 JSON in a secret (the tool
          # accepts either). Secret wins when both are present.
          config: "${{ secrets.GSR_CONFIG || vars.GSR_CONFIG }}"
          # Org mode needs a classic PAT (security_events, repo, read:org); the
          # ephemeral GITHUB_TOKEN cannot read org-wide security data. The
          # secret name is project-specific so multiple LF orgs (e.g. ONAP,
          # O-RAN-SC, OpenDaylight) can each carry their own scoped PAT.
          token: "${{ secrets.LFRELENG_ACTIONS_REPORT_PAT }}"
          # Export the PAT under this name so it matches the per-org
          # "token_env" in GSR_CONFIG; the tool resolves each org's token by
          # that name, not by the action's default (GITHUB_TOKEN).
          token_env: "LFRELENG_ACTIONS_REPORT_PAT"
          output_dir: "site"
          pages_url: "${{ steps.pages-url.outputs.url }}"
          slack_channel: "${{ vars.SLACK_CHANNEL_ID }}"
          force_notify: "${{ inputs.force_notify || 'false' }}"
          use_local_source: "${{ inputs.use_local_source || 'false' }}"

      - name: "Upload Pages artifact"
        # yamllint disable-line rule:line-length
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: "site"

      - name: "Check Slack configuration"
        id: slack-config
        if: steps.report.outputs.should_notify == 'true'
        shell: bash
        env:
          SLACK_BOT_TOKEN: "${{ secrets.SLACK_BOT_TOKEN }}"
          SLACK_CHANNEL_ID: "${{ vars.SLACK_CHANNEL_ID }}"
        run: |
          # Slack needs both a bot token and a channel id. If either is
          # missing, disable the integration gracefully rather than failing
          # the job, warning in both the console and the step summary.
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="⚠️ Slack integration not available; requires token/credentials"
            echo "::warning::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Send Slack digest"
        if: steps.slack-config.outputs.configured == 'true' && steps.report.outputs.slack_payload != ''
        # yamllint disable-line rule:line-length
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: "chat.postMessage"
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          payload: "${{ steps.report.outputs.slack_payload }}"

  deploy:
    name: "Deploy to GitHub Pages"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write  # Deploy the built site to GitHub Pages
      id-token: write  # OIDC token for the Pages deployment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: "Harden runner"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: "Deploy to GitHub Pages"
        id: deployment
        # yamllint disable-line rule:line-length
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      - name: "Publish report URL to summary"
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## 📊 Security report published"
            echo ""
            echo "[${PAGE_URL}](${PAGE_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-failure:
    name: "Notify Slack of failure"
    needs: [build, deploy]
    # Runs when report generation or Pages deployment failed (a deploy skipped
    # by a failed build still counts). Posts a notice pointing at the Actions
    # page where the recent run history and the manual workflow_dispatch re-run
    # live. The notice reports each job's own outcome rather than asserting
    # which outputs exist: when only the deploy fails, the report has already
    # been generated and the Slack digest may already have been posted, so a
    # blanket "no report was produced" would itself be inaccurate.
    if: failure()
    runs-on: ubuntu-latest
    # Same environment as the build job so the environment-scoped Slack
    # credentials are available here too.
    environment: 'production'
    timeout-minutes: 5
    steps:
      - name: "Harden runner"
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: audit

      - name: "Check Slack configuration"
        id: slack-config
        shell: bash
        env:
          SLACK_BOT_TOKEN: "${{ secrets.SLACK_BOT_TOKEN }}"
          SLACK_CHANNEL_ID: "${{ vars.SLACK_CHANNEL_ID }}"
        run: |
          # Slack needs both a bot token and a channel id. If either is
          # missing, skip the notification gracefully rather than failing
          # this job too, warning in the console and the step summary.
          if [ -n "$SLACK_BOT_TOKEN" ] && [ -n "$SLACK_CHANNEL_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="⚠️ Slack integration not available; requires token/credentials"
            echo "::warning::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Send failure notification"
        if: steps.slack-config.outputs.configured == 'true'
        # yamllint disable-line rule:line-length
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: "chat.postMessage"
          token: "${{ secrets.SLACK_BOT_TOKEN }}"
          # Links are derived from the running repository so they are correct
          # in forks as well as upstream. Both interpolated job results are
          # enumerated values (success/failure/cancelled/skipped), so neither
          # can carry characters that would break the JSON payload.
          payload: |
            {
              "channel": "${{ vars.SLACK_CHANNEL_ID }}",
              "text": "❌ The security report workflow failed (generate report: ${{ needs.build.result }}, deploy to Pages: ${{ needs.deploy.result }}). Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Security report workflow failed* for `${{ github.repository }}`.\n• Generate report: `${{ needs.build.result }}`\n• Deploy to Pages: `${{ needs.deploy.result }}`\n• <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Failed run (logs)>\n• <${{ github.server_url }}/${{ github.repository }}/actions/workflows/reporting.yaml|Recent runs / manual re-run>"
                  }
                }
              ]
            }
