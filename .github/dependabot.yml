version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(actions)"
    # Wait before opening a bump PR so we don't churn on a release
    # that gets retracted or superseded shortly after it ships.
    # This is required to satisfy the zizmor workflow auditing tool.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(deps)"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    exclude-paths:
      - "LICENSES/**"
  - package-ecosystem: "pip"
    # Runtime pin for the published tool this action installs at runtime.
    directory: "/.github/runtime-pin"
    schedule:
      # Checked daily rather than weekly. The cooldown below already delays a
      # new release by seven days; adding a weekly check on top meant a version
      # that aged out of the cooldown then waited for the next Monday, by which
      # point a later release had usually superseded it. The pin advanced one
      # release per week at best, and the published Pages report -- which runs
      # whatever this pin names -- trailed the tool this repository had shipped
      # by a fortnight. A daily check removes that second delay: each release
      # is proposed the day it becomes eligible.
      interval: "daily"
    commit-message:
      prefix: "CI(deps)"
    # Seven days is a floor, not a preference: zizmor's dependabot-cooldown
    # audit reports anything shorter, and the workflow audit fails on any
    # finding. Shortening it for this first-party package is therefore not
    # available, which is why the schedule above carries the improvement.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
